server:
  port: 8080

spring:
  application:
    name: lifesync-backend

  datasource:
    url: jdbc:mysql://localhost:3306/lifesync_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root       # <-- change to your MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # fine for dev; switch to 'validate' + migrations later
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Custom JWT settings
lifesync:
  jwt:
    secret: "ReplaceThisWithA256BitMinimumRandomSecretKeyForLifeSyncJWTSigning!"
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days

logging:
  level:
    com.lifesync: DEBUG
